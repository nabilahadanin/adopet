{% extends 'navbar.html' %}
{% block content_block %}
<a href="/user/detail-open-adopt/" class="btn btn-kembali"> < Kembali</a>
<div class="container">
	<div class="row justify-content-md-center">
		<p class="judul-form">Form Pengadopsian</p><br>
	</div>
</div>

<div class="container">
	<form>
		<div class="form-group">
			<div class="form-group1">
				<label for="nama-penerima">Nama Lengkap :</label><br>
				<textarea class="form-control" id="nama-penerima" cols="10" rows="1" placeholder="Tulis Nama Lengkapmu"></textarea>
            </div>
            <div class="form-group2">
				<label for="nomor-hp">Nomor HP :</label><br>
				<textarea class="form-control" id="nomor-hp" cols="10" rows="1" placeholder="Tulis Nomor HPmu"></textarea>
			</div>
			<div class="form-group3">
				<label for="alamat-penerima">Alamat Lengkap :</label>
				<textarea class="form-control" id="alamat-penerima" cols="50" rows="3" placeholder="Tulis Alamatmu Disini"></textarea>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Request Adopsi</button>
    </form>
</div>
{% endblock content_block %}
