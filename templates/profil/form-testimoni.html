{% extends 'navbar.html' %}
{% block content_block %}
{% load static %}
<head>
    <link rel="stylesheet" href="{% static 'css/profil.css' %}" type="text/CSS">
</head>
<a href="/user/profil/" class="btn btn-kembali"> < Kembali</a>
<div class="container">
	<p class="form-testimoni">Form Testimoni</p>
	<form method="POST"> {% csrf_token %}
		<div class="form-group">
			<label for="rating-user">Beri Nilai User :</label>
			<div class="form-control">
				<div class="row rating-user">
					<div class="col">
						<input type="radio" id="rating-lima" name="nilai_user" value="5">
						<label for="rating-lima">5</label><br>
					</div>
					<div class="col">
						<input type="radio" id="rating-empat" name="nilai_user" value="4">
						<label for="rating-empat">4</label><br>
					</div>
					<div class="col">
						<input type="radio" id="rating-tiga" name="nilai_user" value="3">
						<label for="rating-tiga">3</label>
					</div>	
					<div class="col">
						<input type="radio" id="rating-dua" name="nilai_user" value="2">
						<label for="rating-dua">2</label>
					</div>	
					<div class="col">
						<input type="radio" id="rating-satu" name="nilai_user" value="1">
						<label for="rating-satu">1</label>
					</div>	
				</div>
			</div>
		</div>
		<div class="form-group">
			<label for="isi-artikel">Komentar untuk Adoptee:</label>
			<textarea class="form-control" name="komentar_user" cols="50" rows="6"></textarea>
		</div>
		<div class="form-group">
			<label for="img">Input Foto :</label>
			<input class="img" type="file" id="formFileMultiple" accept="image/*" multiple> 
		</div>
		<div class="row justify-content-center unggah">
			<button type="submit" class="btn btn-secondary">Unggah</button>
		</div>
	</form>
</div>
{% endblock content_block %}
