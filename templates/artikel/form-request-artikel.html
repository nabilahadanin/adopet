{% extends 'head.html' %}
{% block content_block %}
{% load static %}
<head>
	<link rel="stylesheet" href="{% static 'css/artikel.css' %}" type="text/CSS">
</head>
<a href="/user/" class="btn btn-kembali"> < Kembali</a>
<div class="container">
	<div class="row justify-content-md-center">
		<h1 class="head-artikel">Form Request Artikel</h1>
	</div>
</div>
<div class="container">
	<form>
		<div class="form-group">
			<div class="form-group1">
				<label for="judul-artikel">Judul Artikel :</label><br>
				<textarea class="form-control" id="isi-artikel" cols="10" rows="1" placeholder="Tulis Judul Disini"></textarea>
			</div>
			<div class="form-group2">
				<label for="isi-artikel">Isi Artikel :</label>
				<textarea class="form-control" id="isi-artikel" cols="50" rows="6" placeholder="Tulis Artikelmu Disini"></textarea>
			</div>
			<div class="form-group3">
				<label for="img">Foto Artikel :</label>
				<input type="file" class="form-control-file" id="img" name="img" accept="image/*">
			</div>
			<br>
			<label for="tag-artikel">Tag Artikel :</label>
			<div class="row tag-artikel">
				<div class="col">
					<input type="checkbox" id="tag-anjing" name="tag-anjing" value="anjing">
					<label for="tag-anjing"> anjing</label><br>
				</div>
				<div class="col">
					<input type="checkbox" id="tag-kucing" name="tag-kucing" value="kucing">
					<label for="tag-kucing"> kucing</label><br>
				</div>
				<div class="col">
					<input type="checkbox" id="tag-artikel" name="tag-artikel" value="artikel">
					<label for="tag-artikel"> artikel</label><br>
				</div>
				<div class="col">
					<input type="checkbox" id="tag-makanan" name="tag-makanan" value="makanan">
					<label for="tag-makanan"> makanan</label><br>
				</div>
			</div>
			<br>
			<button type="submit" class="btn btn-primary">Request Artikel</button>
		</div>
	</form>
</div>
{% endblock content_block %}
